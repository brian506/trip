spring:
  datasource:
    # 컨텍스트마다 다른 인메모리 DB를 써서 캐시된 컨텍스트끼리 스키마가 충돌하지 않게 한다.
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate

supplier:
  circuit-breaker:
    # 브레이커 빈은 컨텍스트마다 하나라 테스트끼리 실패가 쌓인다. 통합 테스트에서는 열리지 않게 둔다.
    minimum-number-of-calls: 1000
  retry:
    # 운영 백오프(2s·6s)를 그대로 쓰면 목록 조회 실패 한 번이 8초를 먹는다.
    wait-duration: 10ms

# 테스트 컨텍스트 기동 시 공급사를 호출하지 않는다. 공급사 호출은 MockWebServer로 테스트마다 준다.
stay:
  sync:
    enabled: false
