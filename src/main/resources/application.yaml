spring:
  application:
    name: trip

  datasource:
    url: jdbc:h2:file:./data/trip
    username: sa
    password: ""

  sql:
    init:
      # 실행마다 schema.sql을 실행
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    # OSIV 해제
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        # 엔티티별로 순서대로 처리
        order_updates: true

  threads:
    virtual:
      enabled: true

supplier:
  endpoints:
    A:
      base-url: http://localhost:9090
      api-key: dev-key-a
    B:
      base-url: http://localhost:9090
      api-key: dev-key-b
  connect-timeout: 1s
  # 묶음을 순차로 부르므로 (연결 + 응답 x 묶음 수)가 전체 타임아웃 5초 안에 들어가야 한다.
  response-timeout: 2s
  # 커넥션 풀은 공급사마다 따로 둔다. 크기는 곧 동시에 처리할 검색 요청 수다.
  max-connections: 50
  pending-acquire-timeout: 200ms
  max-idle-time: 30s
  # 검색 한 건이 공급사 호출에 쓸 수 있는 전체 시간. 넘긴 공급사는 취소되고 failures[]에 TOTAL_TIMEOUT_EXCEEDED로 담긴다.
  total-timeout: 5s

stay:
  sync:
    # 동기화 : 기동 시 1회 + 매일 04:00.
    enabled: true
    cron: "0 0 4 * * *"
